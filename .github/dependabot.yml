# Weekly dependency update PRs. Grouped so each ecosystem opens one PR, not dozens.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  # Electron ships Chromium security fixes; keep the desktop app current.
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      desktop: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
