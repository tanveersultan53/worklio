name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: worklio
          POSTGRES_PASSWORD: worklio
          POSTGRES_DB: worklio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worklio -d worklio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only placeholder values; nothing here is a real secret.
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgresql+asyncpg://worklio:worklio@localhost:5432/worklio
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      S3_ENDPOINT_URL: http://localhost:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
      S3_ACCESS_KEY: worklio
      S3_SECRET_KEY: worklio-secret
      S3_BUCKET: worklio-uploads

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Service containers can't take a custom command, so SeaweedFS (S3) is started here with the
      # same flags and dev credentials as docker-compose.yml. Upload tests need it.
      - name: Start SeaweedFS (S3)
        working-directory: .
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Migrate
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1

      - name: Create S3 bucket
        run: |
          for i in $(seq 1 30); do
            python -c "from app.core import storage; storage.ensure_bucket()" && exit 0
            sleep 2
          done
          docker logs s3
          exit 1

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (tsc + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        # Next.js generates route types (LayoutProps, PageProps…) that tsc needs on a fresh checkout.
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
