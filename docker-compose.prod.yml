# Production stack. Put a TLS-terminating reverse proxy (Caddy, Nginx, a cloud load balancer)
# in front: https://app.example.com -> web:3000, https://api.example.com -> api:8000 (with
# WebSocket upgrade), wss://rtc.example.com -> livekit:7880. See docs/DEPLOYMENT.md.
#
#   cp .env.production.example .env.production   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

# Every service caps its logs (5 × 10 MB), so a busy day can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  logging: *logging
  build:
    context: ./backend
    args: { EXTRAS: "" }
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    healthcheck:
      # The worker answers a ping through the broker; a hung or disconnected worker doesn't.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 40s
      retries: 3

  beat:
    # Required: reminders, scheduled messages and upload cleanup run on this scheduler.
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  web:
    logging: *logging
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  livekit:
    logging: *logging
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
    # 7880 signalling (behind the TLS proxy), 7881 TCP + 7882 UDP media (open in the firewall).
    ports: ["127.0.0.1:7880:7880", "7881:7881", "7882:7882/udp"]

volumes:
  pgdata:
  redisdata:
