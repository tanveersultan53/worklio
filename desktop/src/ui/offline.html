<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'" />
    <title>Worklio</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="center">
      <div class="card">
        <img class="logo" src="logo.png" alt="" />
        <h1>Can’t reach your Worklio server</h1>
        <p class="muted">Check your internet connection and that the server is running. Worklio reconnects by itself when your network comes back.</p>
        <p class="hint muted" id="detail"></p>
        <div class="actions">
          <button class="btn primary" id="retry" type="button">Retry</button>
          <button class="btn" id="change" type="button">Change server…</button>
        </div>
      </div>
    </main>
    <script type="module" src="offline.js"></script>
  </body>
</html>
