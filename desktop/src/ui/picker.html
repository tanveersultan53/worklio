<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Share your screen</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <div class="picker">
      <header>
        <h1>Choose what to share</h1>
        <div role="tablist" aria-label="Source type" class="tabs">
          <button role="tab" id="tab-screen" aria-selected="true" data-kind="screen">Entire screen</button>
          <button role="tab" id="tab-window" aria-selected="false" data-kind="window">Window</button>
        </div>
      </header>
      <p class="muted empty" id="empty" hidden></p>
      <ul class="grid" id="grid" role="listbox" aria-label="Sources"></ul>
      <footer class="actions">
        <button class="btn" id="cancel" type="button">Cancel</button>
        <button class="btn primary" id="share" type="button" disabled>Share</button>
      </footer>
    </div>
    <script type="module" src="picker.js"></script>
  </body>
</html>
