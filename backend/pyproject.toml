[project]
name = "worklio-api"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.165.0",
  "sqlalchemy[asyncio]>=2.1.9",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "pydantic-settings>=2.16.3",
  "pyjwt>=2.15.1",
  "pwdlib[argon2]>=0.4.2",
  "redis>=8.1.0",
  "celery[redis]>=5.7.0",
  "pgvector>=0.5.1",
  "boto3>=1.44.6",
  "anthropic>=2.10.0,<3",
  "pycrdt>=0.14.13,<0.15",
  "openai>=3.55.1,<4",
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "httpx>=0.28.1", "ruff>=0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
